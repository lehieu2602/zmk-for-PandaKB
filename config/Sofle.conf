# Battery level report interval (seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Key debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Increase BLE TX power to reduce latency and improve left–right half connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Bluetooth device name
CONFIG_ZMK_KEYBOARD_NAME="HieuDepTrai_KB"
# Fix battery reporting bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# BLE Data Length Extension: larger packets (faster Studio over BLE, better compatibility with some Intel adapters)
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# Experimental BLE connection settings for stability (helps with Intel Bluetooth adapters)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Keep Bluetooth pairings across reboots and wake from deep sleep
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# OLED display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Idle & sleep
# Idle after 10 minutes of inactivity (OLED turns off)
CONFIG_ZMK_IDLE_TIMEOUT=600000
# Turn OLED off when idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Deep sleep after 15 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
